[package]
name = "ofvr"
version = "0.0.1"
authors = ["Gabriel DeMoura <gabrielteratos@gmail.com>"]

description = """OFVR i.e.: One File VeRsioning is a version control
system for a single file, initially thought of as a tool to allow to
diffing and patching of binary files."""

edition = "2024"
homepage = "https://github.com/gabrielfalcao/ofvr"
license = "MIT OR Apache-2.0"
readme = "README.md"
# autoexamples = false
autobenches = false

[dependencies]
chrono = { version = "0.4.38", features = ["serde", "libc"] }
bincode = "1.3.3"
serde = { version = "1.0.215", features = ["derive"] }
t16 = "0.0.1"
bt-diff = "0.0.1"
og-enum-to-string = "0.1.0"
clap = { version = "4.5.21", features = ["derive", "env"] }
iocore = { version = "3.0.1" }
hex = "0.4.3"
flate2 = "1.0.35"
serde_bytes = "0.11.15"
serde_json = "1.0.133"
sha2 = "0.10.8"
sha3 = "0.10.8"
md5 = "0.8.0"
toml = "0.9.5"
rand = { version = "0.9.1", features = ["serde"] }
sanitation = "1.0.3"


[[bin]]
name = "ofvr"
path = "src/main.rs"

[lib]
name = "ofvr"
path = "src/lib.rs"
crate-type = ["lib"]
required-features = []

[dev-dependencies]
iocore-test = "2.3.2"

# [profile.release]
# lto = true
# overflow-checks = true
# panic = "unwind"
# strip = true

# [profile.bench]
# debug = true

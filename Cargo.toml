[package]
name = "ofvr"
version = "0.1.0"
authors = ["Gabriel DeMoura <gabrielteratos@gmail.com>"]

description = """OFVR i.e.: One File VeRsioning is a version control
system for a single file, initially thought of as a tool to allow to
diffing and patching of binary files."""

edition = "2024"
homepage = "https://github.com/gabrielfalcao/ofvr"
license = "MIT OR Apache-2.0"
readme = "README.md"
autoexamples = false
autobenches = false

[dependencies]
chrono = { version = "0.4.45", features = ["serde", "libc"] }
serde = { version = "1.0.229", features = ["derive"] }
t16 = "0.0.1"
bt-diff = "0.0.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
iocore = { version = "3.1.0" }
hex = "0.4.3"
flate2 = "1.1.9"
serde_bytes = "0.11.19"
serde_json = "1.0.151"
sha2 = "0.11.0"
sha3 = "0.12.0"
md5 = "0.8.1"
toml = "0.9.8"
rand = { version = "0.9.5", features = ["serde"] }
sanitation = "1.0.3"
postcard = { version = "1.1.3", features = ["use-std", "use-crc", "crc", "postcard-derive", "defmt", "use-defmt"] }
thiserror = "2.0.20"
color-eyre = "0.6.5"


[[bin]]
name = "ofvr"
path = "ofvr.rs"

[lib]
name = "ofvr"
path = "src/lib.rs"
crate-type = ["lib"]
required-features = []

[dev-dependencies]
iocore-test = "3.1.0"

